name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per book, with the same checks each book ran in its own repository.
  aposd2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: books/aposd2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: books/aposd2e/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: npm ci
      - name: Traditional Chinese matches the simplified source
        run: uv run --with opencc==1.4.1 python3 bin/zh-tw.py --check
      - name: Generated files are up to date
        run: |
          uv run --with opencc==1.4.1 python3 bin/chapter_figures.py --check
          uv run --with opencc==1.4.1 python3 tools/localize.py --check
          python3 bin/glossary.py --check
      - name: Reader content contracts
        run: |
          npm test
          uv run --with opencc==1.4.1 python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/verify.py --complete
      - name: Build
        run: npm run build

  swe-at-google:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: books/swe-at-google
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests compare the book text against the swe-at-google/translation-polish tag
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --project tools --locked
      - name: Run tests
        run: uv run --project tools --with pytest pytest -q tools
      - name: Check generated reader files are up to date
        run: |
          uv run --project tools python tools/build_chapter_figures.py
          uv run --project tools python tools/build_reader_manifest.py
          uv run --project tools python tools/build_search_index.py
          git diff --exit-code -- index.html assets/diagrams assets/reader-manifest.json assets/reader-content assets/code-variants assets/search-index.json

  # Build all books into one site and publish it with GitHub Pages.
  deploy:
    needs: [aposd2e, swe-at-google]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: books/aposd2e/package-lock.json
      - name: Build the site
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
