name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The book list comes from books/*/book.json, so adding a book needs no change here.
  books:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "ids=$(python3 scripts/site.py list --json)" >> "$GITHUB_OUTPUT"

  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Framework tests
        run: uv run --project framework/tools --locked --with pytest pytest -q framework/tools/tests

  check:
    needs: books
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJSON(needs.books.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # some books compare their text against a git tag
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check ${{ matrix.book }}
        run: python3 scripts/site.py check ${{ matrix.book }}

  # Build all books into one site and publish it with GitHub Pages.
  deploy:
    needs: [framework, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the site
        run: python3 scripts/site.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
